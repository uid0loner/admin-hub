<h1>terraform-cheat-sheet</h1><p class="dim">Examples use the azurerm provider. terraform destroy removes real resources with no undo.</p><input id="q" class="q" type="search" placeholder="Filter snippets" autocomplete="off" spellcheck="false"><div id="snips"></div></main><footer><a href="imprint.html">imprint</a><a href="privacy.html">privacy</a><a href="contact.html">contact</a><a href="#" data-consent-open>cookie settings</a><span>2026 admin_hub</span></footer></div><script>window.SNIPS=[{"t": "Provider block for Azure", "d": "Pins the azurerm provider version. Run terraform init after adding this.", "c": "terraform {\n  required_providers {\n    azurerm = {\n      source  = \"hashicorp/azurerm\"\n      version = \"~> 3.0\"\n    }\n  }\n}\n\nprovider \"azurerm\" {\n  features {}\n}"}, {"t": "Resource group", "d": "The most basic Azure resource.", "c": "resource \"azurerm_resource_group\" \"main\" {\n  name     = \"rg-example\"\n  location = \"westeurope\"\n}"}, {"t": "Reference another resource's attribute", "d": "Terraform infers the dependency automatically from the reference.", "c": "resource \"azurerm_storage_account\" \"main\" {\n  name                     = \"examplestorageacct\"\n  resource_group_name      = azurerm_resource_group.main.name\n  location                 = azurerm_resource_group.main.location\n  account_tier             = \"Standard\"\n  account_replication_type = \"LRS\"\n}"}, {"t": "Variables and a default value", "d": "Declare an input variable with a type and default.", "c": "variable \"location\" {\n  type    = string\n  default = \"westeurope\"\n}"}, {"t": "Output a value", "d": "Prints a value after apply, or lets other configurations reference it with terraform_remote_state.", "c": "output \"storage_account_id\" {\n  value = azurerm_storage_account.main.id\n}"}, {"t": "Remote state in Azure Storage", "d": "Keeps state off your laptop and lets a team share it.", "c": "terraform {\n  backend \"azurerm\" {\n    resource_group_name = \"rg-terraform-state\"\n    storage_account_name = \"tfstateexample\"\n    container_name       = \"tfstate\"\n    key                  = \"prod.terraform.tfstate\"\n  }\n}"}, {"t": "Data source: look up an existing resource", "d": "Reads an existing resource group without managing it.", "c": "data \"azurerm_resource_group\" \"existing\" {\n  name = \"rg-shared\"\n}"}, {"t": "Count to create multiple resources", "d": "Creates three storage accounts named example-storage-0, -1, -2.", "c": "resource \"azurerm_storage_account\" \"main\" {\n  count                    = 3\n  name                     = \"examplestorage${count.index}\"\n  resource_group_name      = azurerm_resource_group.main.name\n  location                 = azurerm_resource_group.main.location\n  account_tier             = \"Standard\"\n  account_replication_type = \"LRS\"\n}"}, {"t": "for_each over a map", "d": "Creates one resource per entry, named by key instead of index.", "c": "variable \"storage_accounts\" {\n  type = map(string)\n  default = {\n    logs   = \"examplelogs\"\n    backup = \"examplebackup\"\n  }\n}\n\nresource \"azurerm_storage_account\" \"main\" {\n  for_each                 = var.storage_accounts\n  name                     = each.value\n  resource_group_name      = azurerm_resource_group.main.name\n  location                 = azurerm_resource_group.main.location\n  account_tier             = \"Standard\"\n  account_replication_type = \"LRS\"\n}"}, {"t": "Core CLI workflow", "d": "The commands you run in order, every time.", "c": "terraform init\nterraform plan -out=tfplan\nterraform apply tfplan"}, {"t": "Format and validate", "d": "Run before committing. fmt rewrites files in place.", "c": "terraform fmt -recursive\nterraform validate"}, {"t": "Import an existing resource", "d": "Brings a resource created outside Terraform under its management, matched to this resource block.", "c": "terraform import azurerm_resource_group.main /subscriptions/SUBSCRIPTION_ID/resourceGroups/rg-example"}, {"t": "Target a single resource", "d": "Applies changes to just one resource, useful for troubleshooting.", "c": "terraform apply -target=azurerm_storage_account.main"}, {"t": "Destroy everything", "d": "Removes every resource this configuration manages. There is no undo.", "c": "terraform destroy"}]</script><script src="cheat.js" defer></script><script src="shell.js" defer></script><script src="consent.js" defer></script><script src="reveal.js" defer></script><script src="pwa.js" defer></script><script src="search-index.js" defer></script><script src="search.js" defer></script></body></html>
