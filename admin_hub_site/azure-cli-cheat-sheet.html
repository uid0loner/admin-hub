</head><body><div class="wrap"><header><a class="brand" href="index.html">admin_hub</a><nav aria-label="Main"><a href="tools.html">tools</a><a href="cheat-sheets.html">cheat-sheets</a><a href="checklists.html">checklists</a><a href="glossary.html">glossary</a><a href="explainers.html">explainers</a><a href="news.html">news</a><a href="start-here.html">start-here</a><a href="about.html">about</a></nav><button class="btn sbtn" type="button" data-search aria-label="Search the site" title="Search (Ctrl+K)">search</button></header><main><h1>azure-cli-cheat-sheet</h1><p class="dim">Replace names such as myRG, myVM and user@contoso.com with your own values.</p><input id="q" class="q" type="search" placeholder="Filter snippets" autocomplete="off" spellcheck="false"><div id="snips"></div></main><footer><a href="imprint.html">imprint</a><a href="privacy.html">privacy</a><a href="contact.html">contact</a><a href="#" data-consent-open>cookie settings</a><span>2026 admin_hub</span></footer></div><script>window.SNIPS=[{"t": "Sign in", "d": "Opens a browser for interactive sign-in.", "c": "az login"}, {"t": "Sign in with a device code", "d": "For machines without a browser.", "c": "az login --use-device-code"}, {"t": "Show the active account", "d": "Current subscription and tenant.", "c": "az account show"}, {"t": "List subscriptions", "d": "All subscriptions you can access.", "c": "az account list --output table"}, {"t": "Switch subscription", "d": "Set the subscription for later commands.", "c": "az account set --subscription \"Subscription name or ID\""}, {"t": "List resource groups", "d": "Overview as a table.", "c": "az group list --output table"}, {"t": "Create a resource group", "d": "Example in West Europe.", "c": "az group create --name myRG --location westeurope"}, {"t": "List VMs with power state", "d": "Adds details such as the power state.", "c": "az vm list --show-details --output table"}, {"t": "Stop and deallocate a VM", "d": "Only a deallocated VM stops compute billing.", "c": "az vm deallocate --resource-group myRG --name myVM"}, {"t": "Role assignments of a user", "d": "Everything a user can do across the subscription.", "c": "az role assignment list --assignee user@contoso.com --all --output table"}, {"t": "Assign a role", "d": "Example: Reader on a subscription.", "c": "az role assignment create --assignee user@contoso.com --role Reader --scope /subscriptions/SUBSCRIPTION_ID"}, {"t": "List public IP addresses", "d": "Find what is exposed.", "c": "az network public-ip list --output table"}, {"t": "List NSG rules", "d": "Rules of a network security group.", "c": "az network nsg rule list --resource-group myRG --nsg-name myNSG --output table"}, {"t": "Storage accounts with public blob access", "d": "Security check with a JMESPath query.", "c": "az storage account list --query \"[].{Name:name,PublicAccess:allowBlobPublicAccess}\" --output table"}, {"t": "List Key Vault secrets", "d": "Names and metadata only, not the values.", "c": "az keyvault secret list --vault-name myVault --output table"}, {"t": "List Entra users", "d": "Names and user principal names.", "c": "az ad user list --query \"[].{Name:displayName,UPN:userPrincipalName}\" --output table"}]</script><script src="cheat.js" defer></script><script src="consent.js" defer></script><script src="reveal.js" defer></script><script src="pwa.js" defer></script><script src="search-index.js" defer></script><script src="search.js" defer></script></body></html>
