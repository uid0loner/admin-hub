"param storageName string\nparam location string = resourceGroup().location\n\nresource sa 'Microsoft.Storage/storageAccounts@2023-01-01' = {\n  name: storageName\n  location: location\n  sku: { name: 'Standard_LRS' }\n  kind: 'StorageV2'\n}"}, {"t": "Reference an existing resource", "d": "Read properties of a resource that already exists, without redeploying it.", "c": "resource existingVnet 'Microsoft.Network/virtualNetworks@2023-05-01' existing = {\n  name: 'myVnet'\n}"}, {"t": "Module reference", "d": "Call a reusable Bicep module with parameters.", "c": "module storage 'modules/storage.bicep' = {\n  name: 'storageDeployment'\n  params: {\n    storageName: 'mystorageacct'\n    location: resourceGroup().location\n  }\n}"}, {"t": "Output a value from a deployment", "d": "Return the storage account's endpoint for use elsewhere.", "c": "output blobEndpoint string = sa.properties.primaryEndpoints.blob"}, {"t": "Loop to create multiple resources", "d": "Creates one storage account per name in the array.", "c": "param storageNames array\nresource sa 'Microsoft.Storage/storageAccounts@2023-01-01' = [for name in storageNames: {\n  name: name\n  location: resourceGroup().location\n  sku: { name: 'Standard_LRS' }\n  kind: 'StorageV2'\n}]"}, {"t": "Conditional resource deployment", "d": "Only creates the resource when the condition is true.", "c": "resource sa 'Microsoft.Storage/storageAccounts@2023-01-01' = if (deployStorage) {\n  name: storageName\n  location: resourceGroup().location\n  sku: { name: 'Standard_LRS' }\n  kind: 'StorageV2'\n}"}, {"t": "Reference a Key Vault secret as a parameter", "d": "Pulls a secret value in at deployment time without exposing it in the template.", "c": "param adminPassword string = ''\n// In the parameters file:\n// \"adminPassword\": { \"reference\": { \"keyVault\": { \"id\": \"/subscriptions/.../vaults/myVault\" }, \"secretName\": \"vmAdminPassword\" } }"}]</script><script src="cheat.js" defer></script><script src="consent.js" defer></
